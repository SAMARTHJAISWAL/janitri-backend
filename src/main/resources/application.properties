# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Defaults to an in-memory H2 database (data is lost on restart).
# Override with environment variables to point at another database, e.g.
#   DB_URL=jdbc:h2:file:./data/janitridb DB_USERNAME=sa DB_PASSWORD=change-me
spring.datasource.url=${DB_URL:jdbc:h2:mem:janitridb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (off by default; set H2_CONSOLE_ENABLED=true for local debugging only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.janitri=DEBUG
